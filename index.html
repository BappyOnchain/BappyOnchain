<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Unicode Tools · Built by BappyOnchain · https://github.com/BappyOnchain -->

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Free privacy-first text tools — hide secret messages, inspect hidden Unicode, and style text.">
<meta name="color-scheme" content="light dark">

<meta name="theme-color" content="#0F0B1E" media="(prefers-color-scheme: dark)">
<title>Unicode Tools</title>
<style>
:root{color-scheme:light;--p:#6D3FF5;--p2:#8F6BFF;--pd:#3A1B9E;--on-p:#fff;--sc:#EDE6FF;--on-sc:#3A1B9E;--bg:#F8F6FF;--bgrgb:248,246,255;--s1:#FFFFFF;--s3:#F1ECFF;--tx:#17122B;--tx2:#5F5978;--ol:#B3ABD0;--olv:#E6E0F7;--er:#D23B3B;--inv:#241B47;--inv-tx:#F5F2FF;--shadow:0 1px 2px rgba(31,16,82,.05),0 10px 24px -12px rgba(76,37,196,.2);--hh:66px;--f:system-ui,-apple-system,'Segoe UI','Inter',Roboto,'Noto Sans','Ubuntu','Cantarell','Helvetica Neue',Arial,sans-serif;--emo:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);--gb:rgba(255,255,255,.55);--gb2:rgba(255,255,255,.22);--gbd:rgba(255,255,255,.7);--gsh:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(120,90,220,.08),0 0 0 1px rgba(120,90,220,.07);--fld:rgba(255,255,255,.45);--shn:rgba(255,255,255,.45);--tn:.16}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--p:#B49CFF;--p2:#8F6BFF;--pd:#E6DEFF;--on-p:#1B0F45;--sc:#2E2458;--on-sc:#E6DEFF;--bg:#0F0B1E;--bgrgb:15,11,30;--s1:#17122E;--s3:#211A40;--tx:#EFEBFF;--tx2:#B3ABD3;--ol:#5A5185;--olv:#2D2552;--er:#FF8585;--inv:#E9E4F7;--inv-tx:#1E1640;--shadow:0 1px 2px rgba(0,0,0,.35),0 10px 24px -12px rgba(0,0,0,.6);--gb:rgba(48,36,96,.5);--gb2:rgba(48,36,96,.18);--gbd:rgba(255,255,255,.12);--gsh:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(255,255,255,.04),0 0 0 1px rgba(255,255,255,.04);--fld:rgba(255,255,255,.05);--shn:rgba(255,255,255,.1);--tn:.24}}
:root[data-theme=dark]{color-scheme:dark;--p:#B49CFF;--p2:#8F6BFF;--pd:#E6DEFF;--on-p:#1B0F45;--sc:#2E2458;--on-sc:#E6DEFF;--bg:#0F0B1E;--bgrgb:15,11,30;--s1:#17122E;--s3:#211A40;--tx:#EFEBFF;--tx2:#B3ABD3;--ol:#5A5185;--olv:#2D2552;--er:#FF8585;--inv:#E9E4F7;--inv-tx:#1E1640;--shadow:0 1px 2px rgba(0,0,0,.35),0 10px 24px -12px rgba(0,0,0,.6);--gb:rgba(48,36,96,.5);--gb2:rgba(48,36,96,.18);--gbd:rgba(255,255,255,.12);--gsh:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(255,255,255,.04),0 0 0 1px rgba(255,255,255,.04);--fld:rgba(255,255,255,.05);--shn:rgba(255,255,255,.1);--tn:.24}
.h-purple{--hr:124,77,255;--h:#7C4DFF;--h1:#A586FF;--h2:#5B32E8}
.h-indigo{--hr:91,91,240;--h:#5B5BF0;--h1:#8A8AFF;--h2:#3D3DD6}
.h-blue{--hr:47,123,255;--h:#2F7BFF;--h1:#5FA3FF;--h2:#1D5FE0}
.h-teal{--hr:16,165,142;--h:#10A58E;--h1:#35D0B5;--h2:#0A8573}
.h-green{--hr:47,180,90;--h:#2FB45A;--h1:#5CD883;--h2:#1F9644}
.h-amber{--hr:227,161,0;--h:#E3A100;--h1:#FFCB3D;--h2:#E08A00}
.h-orange{--hr:245,140,35;--h:#F58C23;--h1:#FFB347;--h2:#E8650C}
.h-pink{--hr:238,75,139;--h:#EE4B8B;--h1:#FF7FB0;--h2:#D42A6E}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--hh) + 12px)}
body{background:var(--bg);color:var(--tx);font:16px/1.5 var(--f);min-height:100vh;min-height:100dvh;overflow-x:hidden;transition:background-color .3s,color .3s;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.offscr{position:fixed;left:-9999px;top:0;opacity:0}
.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.i .d{fill:currentColor;fill-opacity:.24}
.i .f{fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--p);outline-offset:2px;border-radius:8px}
.prog{position:fixed;top:0;left:0;width:100%;height:3px;transform-origin:0 50%;transform:scaleX(var(--sp,0));background:linear-gradient(90deg,#8F6BFF,#EE4B8B);z-index:40;pointer-events:none}

/* header */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;min-height:var(--hh);padding:calc(8px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) 8px calc(16px + env(safe-area-inset-left,0px));background:rgba(var(--bgrgb),.82);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid transparent;transition:border-color .25s,box-shadow .25s}
.bar.elev{border-color:var(--olv);box-shadow:0 8px 24px -16px rgba(40,20,110,.35)}
.ib{position:relative;width:44px;height:44px;border:0;border-radius:50%;background:none;cursor:pointer;display:grid;place-items:center;color:var(--tx2);text-decoration:none;flex:none;transition:background .2s,color .2s,transform .2s var(--spring)}
.ib:active{transform:scale(.88)}
.ib .i{width:24px;height:24px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-width:0;border-radius:14px}
.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#A07BFF,#5B2FE8);box-shadow:0 8px 16px -6px rgba(91,47,232,.6),inset 0 1px 0 rgba(255,255,255,.4);flex:none;transition:transform .35s var(--spring)}
.logo svg{width:24px;height:24px;display:block}
.brand:hover .logo{transform:rotate(-8deg) scale(1.06)}
.brand b{font-weight:800;font-size:22px;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsearch{position:relative;flex:1;max-width:560px;margin:0 auto 0 28px;min-width:0}
.hsearch .i{position:absolute;left:16px;top:50%;width:20px;height:20px;transform:translateY(-50%);color:var(--tx2);pointer-events:none}
.hsearch input{width:100%;height:46px;border:1px solid transparent;border-radius:23px;background:var(--s3);padding:0 18px 0 46px;outline:none;font-size:15px;transition:box-shadow .2s,border-color .2s,background .2s}
.hsearch input::placeholder{color:var(--tx2);opacity:.9}
.hsearch input:focus{border-color:var(--p);background:var(--s1);box-shadow:0 0 0 4px rgba(124,77,255,.18)}
.hacts{display:flex;align-items:center;gap:4px;margin-left:auto}
.tsw{position:relative;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--tx2);margin:0 6px;height:44px}
.tsw .i{width:20px;height:20px;transition:transform .5s var(--spring),opacity .3s}
.tsw input{position:absolute;opacity:0;width:1px;height:1px}
.tk{width:52px;height:28px;border-radius:14px;background:linear-gradient(135deg,#8F6BFF,#5B32E8);position:relative;transition:background .3s;flex:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.tk::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .35s var(--spring)}
.tsw input:checked+.sun+.tk::after{transform:translateX(24px)}
.tsw .sun{color:#E8A400}
.tsw input:checked+.sun{opacity:.4;transform:rotate(90deg) scale(.8)}
.tsw input:not(:checked)~.moon{opacity:.45;transform:scale(.85)}
.tsw input:focus-visible~.tk{outline:2px solid var(--p);outline-offset:3px}
.menu{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:calc(var(--hh) - 6px);min-width:210px;background:var(--s1);border:1px solid var(--olv);border-radius:18px;padding:8px;box-shadow:0 18px 40px -12px rgba(30,15,90,.35);z-index:35;transform-origin:100% 0;animation:pop .22s var(--spring)}
.menu a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;font-size:15px;position:relative;overflow:hidden}
.menu a .i{width:20px;height:20px;color:var(--tx2)}
.menu a:hover{background:var(--s3)}

/* shell + sidebar */
.shell{display:flex;max-width:1360px;margin:0 auto;align-items:flex-start;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.sidebar{width:272px;flex:none;position:sticky;top:var(--hh);height:calc(100vh - var(--hh));height:calc(100dvh - var(--hh));display:flex;flex-direction:column;border-right:1px solid var(--olv);overflow:hidden;transition:width .3s var(--ease),opacity .25s,border-color .3s}
.shell.collapsed .sidebar{width:0;opacity:0;border-color:transparent;pointer-events:none}
.snav{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin}
.snav a{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:16px;text-decoration:none;font-size:16px;color:var(--tx);min-height:48px;white-space:nowrap;transition:background .2s,color .2s,transform .2s var(--ease)}
.snav a .i{width:22px;height:22px;color:var(--tx2);transition:color .2s,transform .35s var(--spring)}
.snav a.cur{background:var(--sc);color:var(--on-sc);font-weight:700}
.snav a.cur .i{color:var(--p)}
.snav hr{border:0;border-top:1px solid var(--olv);margin:10px 14px}
.snav h3{font-size:13px;font-weight:700;color:var(--p);padding:6px 14px 4px;letter-spacing:.2px}
.wave{flex:none;height:110px;color:var(--p);pointer-events:none;margin-top:auto}
.wave svg{width:100%;height:100%;display:block}
.scrim{position:fixed;inset:0;background:rgba(10,6,30,.5);z-index:44;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.scrim.show{opacity:1;visibility:visible}
.content{flex:1;min-width:0;display:flex;flex-direction:column;min-height:calc(100vh - var(--hh));min-height:calc(100dvh - var(--hh))}
.app{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:24px 28px 48px}
.enter{animation:enter .38s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(12px) scale(.995)}}

/* hero */
.hero{position:relative;display:flex;align-items:center;gap:20px;border-radius:32px;padding:44px 48px;overflow:hidden;background:radial-gradient(520px 260px at 8% 0%,rgba(255,255,255,.75),transparent 70%),linear-gradient(115deg,#F0EAFF 0%,#E2D7FF 55%,#CFC0FF 100%);border:1px solid rgba(124,77,255,.14);box-shadow:var(--shadow)}
:root[data-theme=dark] .hero{background:radial-gradient(520px 260px at 8% 0%,rgba(143,107,255,.35),transparent 70%),linear-gradient(115deg,#241657 0%,#31207F 55%,#4529B4 100%);border-color:rgba(180,156,255,.18)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .hero{background:radial-gradient(520px 260px at 8% 0%,rgba(143,107,255,.35),transparent 70%),linear-gradient(115deg,#241657 0%,#31207F 55%,#4529B4 100%);border-color:rgba(180,156,255,.18)}}
.hero-tx{position:relative;z-index:2;flex:1 1 55%;min-width:0}
.hero h1{font-size:clamp(40px,5.4vw,64px);line-height:1.04;font-weight:800;letter-spacing:-1.6px;color:var(--tx);margin-bottom:16px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#6A3DF0,#3A1B9E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#5B2FE8}
:root[data-theme=dark] .hero h1 em{background:linear-gradient(90deg,#D9C8FF,#A98CFF);-webkit-background-clip:text;background-clip:text}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .hero h1 em{background:linear-gradient(90deg,#D9C8FF,#A98CFF);-webkit-background-clip:text;background-clip:text}}
.hero p{font-size:clamp(16px,1.7vw,20px);color:var(--tx);opacity:.88;max-width:34em;margin-bottom:26px;line-height:1.5}
.hero .row{margin-top:0;gap:14px}
.hero-art{position:relative;z-index:1;flex:0 1 380px;min-width:0}
.hero-art svg{width:100%;height:auto;display:block;overflow:visible}
.a{animation:rise .8s var(--ease) both;animation-delay:calc(var(--d,0)*90ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.flt{animation:float 6s ease-in-out infinite}
.flt2{animation:float 7.5s ease-in-out -2s infinite}
.flt3{animation:float 5s ease-in-out -1s infinite reverse}
@keyframes float{50%{transform:translateY(-10px)}}
.tw{animation:twinkle 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw2{animation-delay:-1.1s}.tw3{animation-delay:-2.1s}
@keyframes twinkle{50%{opacity:.35;transform:scale(.7) rotate(20deg)}}

/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 26px;border:0;border-radius:26px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .2s var(--spring),box-shadow .25s,background .2s,opacity .2s}
.btn .i{width:20px;height:20px}
.btn:active{transform:scale(.95)}
.btn.f{background:linear-gradient(135deg,#7C4DFF,#4B22C9);color:#fff;box-shadow:0 10px 20px -8px rgba(91,50,232,.65)}
:root[data-theme=dark] .btn.f{background:linear-gradient(135deg,#B49CFF,#8F6BFF);color:#1B0F45}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.f{background:linear-gradient(135deg,#B49CFF,#8F6BFF);color:#1B0F45}}
.btn.o{background:var(--sc);color:var(--on-sc)}
.btn.x{background:none;color:var(--p);padding:0 14px}
.btn.line{background:rgba(255,255,255,.35);color:var(--pd);border:1.5px solid rgba(91,47,232,.45)}
:root[data-theme=dark] .btn.line{background:rgba(255,255,255,.06);color:#EFEBFF;border-color:rgba(214,198,255,.5)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.line{background:rgba(255,255,255,.06);color:#EFEBFF;border-color:rgba(214,198,255,.5)}}
.btn.hero1{background:linear-gradient(135deg,#4B22C9,#33177F);color:#fff;box-shadow:0 14px 26px -10px rgba(58,27,158,.7)}
:root[data-theme=dark] .btn.hero1{background:linear-gradient(135deg,#fff,#E6DEFF);color:#2A1470}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.hero1{background:linear-gradient(135deg,#fff,#E6DEFF);color:#2A1470}}
.btn.hero1::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s var(--ease)}
.btn.ok::before{content:"\2713";font-weight:800}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:22px;background:var(--sc);color:var(--on-sc);font-weight:700;font-size:15px;text-decoration:none;position:relative;overflow:hidden;transition:transform .2s var(--spring),background .2s}
.pill .i{width:18px;height:18px;transition:transform .25s var(--ease)}
.pill:active{transform:scale(.95)}

/* section heads + tiles */
.sec{margin-top:40px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.sechead h2,.sub{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.sechead h2::before,.sub::before{content:"";width:5px;height:30px;border-radius:3px;background:linear-gradient(180deg,var(--p2),var(--p));flex:none}
.sub{font-size:20px;margin:30px 0 14px}
.sub::before{height:22px;background:linear-gradient(180deg,var(--h1,var(--p2)),var(--h2,var(--p)))}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.tile{position:relative;overflow:hidden;display:grid;grid-template-columns:60px minmax(0,1fr);gap:16px;align-items:center;min-height:116px;padding:20px 68px 20px 20px;text-decoration:none;color:inherit;border-radius:24px;border:1px solid rgba(var(--hr),.22);background:linear-gradient(135deg,rgba(var(--hr),var(--tn)),rgba(var(--hr),.04) 75%),linear-gradient(135deg,var(--gb),var(--gb2));box-shadow:var(--gsh),var(--shadow);transition:transform .3s var(--ease),border-color .3s}
.tile .ico{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--h1),var(--h2));box-shadow:0 10px 20px -8px rgba(var(--hr),.7),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .45s var(--spring)}
.tile .ico .i{width:30px;height:30px;stroke-width:1.7}
.tile b{display:block;font-weight:700;font-size:17px;letter-spacing:-.2px;line-height:1.25}
.tile .tt span{display:block;font-size:14px;color:var(--tx2);line-height:1.4;margin-top:4px}
.tile .go{position:absolute;right:16px;bottom:16px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(var(--hr),.14);color:var(--h);transition:background .25s,color .25s,transform .35s var(--spring)}
:root[data-theme=dark] .tile .go{color:var(--h1)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tile .go{color:var(--h1)}}
.tile .go .i{width:20px;height:20px;transition:transform .3s var(--ease)}
.tile:active{transform:scale(.97)}
.tile .ripple{background:var(--h)}
.empty{color:var(--tx2);text-align:center;padding:40px 12px}
.rv{transition:opacity .6s var(--ease),transform .6s var(--ease),box-shadow .3s,border-color .3s,background .3s}
.js .rv:not(.in){opacity:0;transform:translateY(22px) scale(.98)}
.rv{transition-delay:calc(var(--i,0)*55ms)}
.rv.in:hover,.rv.in:active{transition-delay:0s}
.recent{margin-top:28px}
.chipsrow{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chipsrow::-webkit-scrollbar{display:none}
.rc{display:inline-flex;align-items:center;gap:10px;flex:none;min-height:44px;padding:6px 16px 6px 8px;border-radius:24px;background:var(--s1);border:1px solid var(--olv);text-decoration:none;font-weight:600;font-size:14px;position:relative;overflow:hidden;transition:transform .2s var(--spring)}
.rc .ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--h1),var(--h2))}
.rc .ico .i{width:16px;height:16px}
.rc:active{transform:scale(.95)}
.rlab{font-size:14px;font-weight:700;color:var(--tx2);margin-bottom:6px}

/* page heads */
.phead{display:flex;align-items:center;gap:18px;margin-bottom:6px}
.phead .ico{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--h1,#A586FF),var(--h2,#5B32E8));box-shadow:0 12px 22px -10px rgba(var(--hr,124,77,255),.7),inset 0 1px 0 rgba(255,255,255,.4);flex:none;animation:pop .5s var(--spring)}
.phead .ico .i{width:32px;height:32px;stroke-width:1.7}
.phead h1{font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.8px;line-height:1.15}
.phead p{color:var(--tx2);font-size:15px;margin-top:2px}
.crumb{display:inline-flex;align-items:center;gap:8px;background:var(--sc);border:0;color:var(--on-sc);font-size:14px;font-weight:700;cursor:pointer;margin-bottom:18px;padding:0 16px 0 12px;min-height:40px;border-radius:20px;position:relative;overflow:hidden;transition:transform .2s var(--spring)}
.crumb .i{width:18px;height:18px;transition:transform .25s var(--ease)}
.crumb:active{transform:scale(.94)}
.prose p,.prose li{color:var(--tx2);font-size:15.5px;line-height:1.65}
.prose h3{font-size:18px;font-weight:700;margin:22px 0 8px;color:var(--tx)}
.prose ul{padding-left:22px;display:grid;gap:8px}
.prose a{color:var(--p);font-weight:600}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:20px}
.feat .card{margin:0;display:flex;gap:14px;align-items:flex-start}
.feat .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--h1),var(--h2));flex:none}
.feat .ico .i{width:24px;height:24px}
.feat b{display:block;font-size:16px}
.feat span{display:block;color:var(--tx2);font-size:14px;margin-top:2px}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:20px}
.contact .tile{min-height:96px;padding-right:20px;grid-template-columns:52px minmax(0,1fr)}
.contact .tile .ico{width:52px;height:52px}
.contact .tile .tt span{word-break:break-all}

/* tool UI */
.thead{margin-bottom:12px}
.card{background:var(--s1);border:1px solid var(--olv);border-radius:24px;padding:22px;margin-top:14px;box-shadow:var(--shadow);transition:background-color .3s,border-color .3s}
.card.t{background:var(--s3);box-shadow:none;animation:pop .35s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:24px;background:var(--s3);margin-bottom:10px;max-width:100%}
.seg button{border:0;background:none;padding:0 24px;min-height:40px;border-radius:20px;cursor:pointer;font-weight:600;font-size:14px;color:var(--tx2);position:relative;overflow:hidden;transition:background .25s,color .25s,transform .2s var(--spring),box-shadow .25s}
.seg button:active{transform:scale(.94)}
.seg button[aria-pressed=true]{background:var(--s1);color:var(--p);box-shadow:0 2px 8px -2px rgba(60,30,160,.35)}
.fd{position:relative;margin-top:22px}
.fd:first-child{margin-top:8px}
.fd textarea,.fd input{width:100%;background:none;border:1.5px solid var(--ol);border-radius:14px;padding:15px 16px;outline:none;transition:border-color .2s,box-shadow .2s;min-height:50px}
.fd textarea{min-height:112px;resize:vertical}
.fd textarea:focus,.fd input:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(124,77,255,.16)}
.fd label{position:absolute;left:12px;top:-10px;padding:0 6px;background:var(--s1);font-size:12px;font-weight:600;color:var(--tx2);border-radius:6px}
.card.t .fd label{background:var(--s3)}
.fd:focus-within label{color:var(--p)}
.fd input.big{font-size:22px;font-family:var(--f),var(--emo)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:14px;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips.flush{margin:0 0 8px}
.chip{position:relative;overflow:hidden;flex:none;min-height:38px;padding:0 16px;border-radius:19px;border:1.5px solid var(--olv);background:var(--s1);font-size:14px;font-weight:600;cursor:pointer;transition:background .2s,color .2s,transform .2s var(--spring),border-color .2s}
.chip:active{transform:scale(.93)}
.chip[aria-pressed=true]{background:var(--sc);color:var(--on-sc);border-color:var(--p)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));max-height:210px;overflow-y:auto;margin-top:12px;border-radius:16px;background:var(--bg);padding:6px;scrollbar-width:thin}
.grid.sm{max-height:150px}
.grid button{position:relative;overflow:hidden;height:46px;border:0;background:none;border-radius:10px;font-size:25px;font-family:var(--emo);cursor:pointer;transition:background .2s,transform .2s var(--spring)}
.grid button:hover{background:var(--s3)}
.grid button:active{transform:scale(.8)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;font-size:15px;font-weight:500;cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:32px;border-radius:16px;border:2px solid var(--ol);background:var(--s3);position:relative;cursor:pointer;transition:background .25s,border-color .25s}
.sw input::after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--ol);transition:left .3s var(--spring),top .3s var(--spring),width .3s var(--spring),height .3s var(--spring),background .2s}
.sw input:checked{background:var(--p);border-color:var(--p)}
.sw input:checked::after{left:24px;top:2px;width:24px;height:24px;background:var(--on-p)}
.rg{display:flex;align-items:center;gap:14px;margin-top:20px;font-size:14px;font-weight:600;color:var(--tx2)}
.rg input{flex:1;accent-color:var(--p);height:32px}
.lb{display:block;font-size:13px;font-weight:700;color:var(--tx2);margin-bottom:10px}
.out{background:var(--bg);border-radius:16px;padding:16px;word-break:break-word;white-space:pre-wrap;font-size:18px;min-height:54px;font-family:var(--f),var(--emo)}
.out.m{font-size:15px;color:var(--tx2)}
.st{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.st.flush{margin:0 0 14px}
.sp{padding:6px 12px;border-radius:10px;background:var(--sc);color:var(--on-sc);font-size:13px;font-weight:600}
.sp.w{background:var(--er);color:var(--bg)}
.mk{background:var(--p);color:var(--on-p);border-radius:5px;padding:0 4px;font-size:11px;margin:0 1px}
.fr{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--olv)}
.fr:first-child{border:0}
.fr div{flex:1;min-width:0}
.fr small{display:block;font-size:12px;font-weight:600;color:var(--tx2)}
.fr span{font-size:18px;word-break:break-word;font-family:var(--f),var(--emo)}
.fr .btn{min-height:40px;padding:0 18px}
.mt12{margin-top:12px}.mt16{margin-top:16px}.mb12{margin-bottom:12px}
.pwm{margin-top:10px;display:flex;align-items:center;gap:10px}
.pwm-bar{flex:1;height:6px;border-radius:3px;background:var(--s3);overflow:hidden}
.pwm-bar i{display:block;height:100%;width:0;border-radius:3px;transition:width .3s var(--ease),background .3s}
.pwm span{font-size:12px;font-weight:700;min-width:50px}
.warn{font-size:13px;color:var(--tx2);margin-top:10px;display:flex;align-items:center;gap:6px}
.warn.hot{color:var(--er)}
.sfr{padding:16px 2px;border-top:1px solid var(--olv)}
.sfr:first-child{border:0;padding-top:0}
.sfr:last-child{padding-bottom:0}
.sfr b{font-weight:700;font-size:16px}
.sfr small{display:block;color:var(--tx2);font-size:13.5px;margin-top:3px}
.sfr.row2{display:flex;align-items:center;justify-content:space-between;gap:14px}
.sfr.row2>a,.sfr.row2>button{flex:none}
.sfr .seg{margin-top:12px}
.snack{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160px);background:var(--inv);color:var(--inv-tx);padding:14px 22px;border-radius:26px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);box-shadow:0 14px 30px -10px rgba(0,0,0,.5);visibility:hidden;transition:transform .45s var(--spring),visibility 0s .45s;z-index:60}
.snack::before{content:"";width:9px;height:9px;border-radius:50%;background:#5CD883;flex:none}
.snack.show{transform:translate(-50%,0);visibility:visible;transition:transform .45s var(--spring),visibility 0s}

/* footer */
.sitefoot{display:grid;grid-template-columns:1fr auto 1fr;gap:12px 24px;align-items:center;padding:22px 28px calc(22px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--olv);color:var(--tx2);font-size:14px;background:var(--s1)}
.sitefoot a{color:var(--p);text-decoration:none;font-weight:600}
.sitefoot a:hover{text-decoration:underline}
.sitefoot .fl{display:flex;align-items:center;gap:10px}
.sitefoot .fl .i{width:20px;height:20px;color:var(--p)}

@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.22)}24%{transform:scale(1)}}
.sitefoot .fc{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.sitefoot .fc i{width:4px;height:4px;border-radius:50%;background:var(--p);display:inline-block}
.sitefoot .fr2{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.sitefoot .fr2 .i{width:20px;height:20px;color:var(--p)}

/* ripple */
.rip-host{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.22;pointer-events:none;animation:rip .55s ease-out}
@keyframes rip{to{transform:scale(2.6);opacity:0}}

 .ib:hover{background:var(--s3);color:var(--tx)}

/* ===== liquid glass + smoothness ===== */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(640px 420px at 10% 6%,rgba(143,107,255,.26),transparent 70%),radial-gradient(560px 440px at 94% 34%,rgba(238,75,139,.15),transparent 70%),radial-gradient(680px 500px at 38% 100%,rgba(47,123,255,.16),transparent 70%)}
.flt,.flt2,.flt3,.tw,.sitefoot .fl .heart{animation:none}
.a{animation-duration:.5s}
.enter{animation-duration:.26s}
.bar{background:linear-gradient(180deg,rgba(var(--bgrgb),.78),rgba(var(--bgrgb),.52));-webkit-backdrop-filter:saturate(1.7) blur(14px);backdrop-filter:saturate(1.7) blur(14px);box-shadow:var(--gsh);transform:translateZ(0)}
.bar.elev{border-color:var(--gbd);box-shadow:var(--gsh),0 8px 24px -16px rgba(40,20,110,.35)}
.card{background:linear-gradient(135deg,var(--gb),var(--gb2));border-color:var(--gbd);box-shadow:var(--gsh),var(--shadow);-webkit-backdrop-filter:blur(12px) saturate(1.5);backdrop-filter:blur(12px) saturate(1.5)}
.card.t{background:linear-gradient(135deg,rgba(var(--hr,124,77,255),var(--tn)),rgba(var(--hr,124,77,255),.05)),linear-gradient(135deg,var(--gb),var(--gb2));box-shadow:var(--gsh)}
.feat .card{-webkit-backdrop-filter:none;backdrop-filter:none}
.fd label,.card.t .fd label{background:var(--s1)}
.fd textarea,.fd input{background:var(--fld)}
.out{background:var(--fld);border:1px solid var(--gbd)}
.grid{background:var(--fld)}
.seg{background:var(--gb2);border:1px solid var(--gbd);box-shadow:var(--gsh)}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,var(--gb),var(--gb2)),var(--s1);box-shadow:var(--gsh),0 2px 8px -2px rgba(60,30,160,.35)}
.chip{background:var(--gb2);border-color:var(--gbd);box-shadow:var(--gsh)}
.chip[aria-pressed=true]{background:var(--sc);border-color:var(--p)}

.menu{background:rgba(var(--bgrgb),.74);-webkit-backdrop-filter:blur(18px) saturate(1.7);backdrop-filter:blur(18px) saturate(1.7);border-color:var(--gbd);box-shadow:var(--gsh),0 18px 40px -12px rgba(30,15,90,.35)}
.snack{background:rgba(28,20,60,.66);color:#fff;-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 14px 30px -10px rgba(0,0,0,.5)}
.sidebar{background:linear-gradient(180deg,var(--gb2),transparent)}
.snav a.cur{box-shadow:var(--gsh),0 6px 14px -8px rgba(91,50,232,.5)}

/* ===== LIQUID GLASS v3 — clear glass, bright rim, edge glow, adaptive tint =====
   Apple's material: mostly transparent, bends/mirrors what is behind it,
   thin bright specular rim (top-left strong, bottom-right soft), floats above content.
   Done with static gradients + inset rim shadows; backdrop-filter only on a few overlays. */
:root{--lf1:rgba(255,255,255,.36);--lf2:rgba(255,255,255,.08);--lf3:rgba(255,255,255,.18);--lspec:rgba(255,255,255,.6);--rim:rgba(255,255,255,.98);--rim2:rgba(255,255,255,.6);--rimline:rgba(255,255,255,.4);--linner:rgba(255,255,255,.3);--ldrop:rgba(60,30,150,.28);
--lg:inset 0 0 0 1px var(--rimline),inset 2px 2px 1.5px -1px var(--rim),inset -2px -2px 1.5px -1px var(--rim2),inset 0 0 18px 1px var(--linner),0 12px 28px -14px var(--ldrop)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--lf1:rgba(255,255,255,.15);--lf2:rgba(255,255,255,.03);--lf3:rgba(255,255,255,.08);--lspec:rgba(255,255,255,.26);--rim:rgba(255,255,255,.65);--rim2:rgba(255,255,255,.3);--rimline:rgba(255,255,255,.2);--linner:rgba(255,255,255,.1);--ldrop:rgba(0,0,0,.6)}}
:root[data-theme=dark]{--lf1:rgba(255,255,255,.15);--lf2:rgba(255,255,255,.03);--lf3:rgba(255,255,255,.08);--lspec:rgba(255,255,255,.26);--rim:rgba(255,255,255,.65);--rim2:rgba(255,255,255,.3);--rimline:rgba(255,255,255,.2);--linner:rgba(255,255,255,.1);--ldrop:rgba(0,0,0,.6)}

/* colourful field behind the glass so there is something to see through it (static = no lag) */
body::before{background:radial-gradient(700px 480px at 8% 4%,rgba(143,107,255,.5),transparent 70%),radial-gradient(620px 480px at 96% 26%,rgba(238,75,139,.32),transparent 70%),radial-gradient(720px 540px at 30% 98%,rgba(47,123,255,.34),transparent 70%),radial-gradient(520px 380px at 82% 80%,rgba(16,165,142,.24),transparent 70%);transform:translateZ(0)}

/* every glass surface */
.card,.card.t,.chip,.rc,.seg,.btn.o,.menu,.tile{
 background:radial-gradient(60% 45% at 8% 0%,var(--lspec),transparent 70%),linear-gradient(135deg,var(--lf1),var(--lf2) 55%,var(--lf3));
 border-color:transparent;box-shadow:var(--lg)}
.card.t,.tile{background:radial-gradient(60% 45% at 8% 0%,var(--lspec),transparent 70%),linear-gradient(135deg,rgba(var(--hr,124,77,255),.2),rgba(var(--hr,124,77,255),.03) 80%),linear-gradient(135deg,var(--lf1),var(--lf2) 55%,var(--lf3))}
.tile{contain:paint}
.tile .ico,.phead .ico,.feat .ico,.rc .ico{box-shadow:0 10px 18px -8px rgba(var(--hr,124,77,255),.75),inset 0 2px 1px rgba(255,255,255,.6),inset 0 -3px 6px rgba(0,0,0,.18)}
.tile .go{background:rgba(var(--hr),.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.btn.f,.btn.hero1{box-shadow:inset 0 2px 1px rgba(255,255,255,.5),inset 0 -3px 6px rgba(0,0,0,.18),0 12px 22px -8px rgba(91,50,232,.65)}
.snav a.cur{background:radial-gradient(70% 90% at 6% 0%,var(--lspec),transparent 70%),linear-gradient(135deg,rgba(124,77,255,.26),rgba(124,77,255,.08));box-shadow:var(--lg)}
.fd textarea,.fd input{background:rgba(255,255,255,.22);box-shadow:inset 0 1px 3px rgba(60,30,160,.12),inset 0 -1px 0 rgba(255,255,255,.5)}
.out,.grid{background:rgba(255,255,255,.26);box-shadow:inset 0 1px 3px rgba(60,30,160,.1),inset 0 -1px 0 rgba(255,255,255,.5)}
:root[data-theme=dark] .fd textarea,:root[data-theme=dark] .fd input,:root[data-theme=dark] .out,:root[data-theme=dark] .grid{background:rgba(255,255,255,.05);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .fd textarea,:root:not([data-theme=light]) .fd input,:root:not([data-theme=light]) .out,:root:not([data-theme=light]) .grid{background:rgba(255,255,255,.05);box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}}
.fd label,.card.t .fd label{background:rgba(var(--bgrgb),.92)}

/* header / menu / footer */
.bar{background:linear-gradient(180deg,rgba(var(--bgrgb),.5),rgba(var(--bgrgb),.3));-webkit-backdrop-filter:blur(10px) saturate(1.8);backdrop-filter:blur(10px) saturate(1.8);box-shadow:inset 0 -1px 0 var(--rimline),inset 0 1px 0 var(--rim2)}
.menu{background:radial-gradient(60% 45% at 8% 0%,var(--lspec),transparent 70%),linear-gradient(135deg,rgba(var(--bgrgb),.55),rgba(var(--bgrgb),.3));-webkit-backdrop-filter:blur(14px) saturate(1.9);backdrop-filter:blur(14px) saturate(1.9)}
.sitefoot{background:linear-gradient(180deg,var(--lf1),var(--lf2));box-shadow:inset 0 1px 0 var(--rim2)}

/* desktop: real backdrop blur on cards */
@media(min-width:880px){
 .card,.chip,.seg,.rc{-webkit-backdrop-filter:blur(8px) saturate(1.8);backdrop-filter:blur(8px) saturate(1.8)}
 .feat .card{-webkit-backdrop-filter:none;backdrop-filter:none}
}

/* ===== PHONE: built for smoothness (no backdrop-filter on anything that moves or scrolls) ===== */
@media(max-width:879px){
 :root{--lf1:rgba(255,255,255,.46);--lf2:rgba(255,255,255,.16);--lf3:rgba(255,255,255,.28);
  --lg:inset 0 0 0 1px var(--rimline),inset 2px 2px 1.5px -1px var(--rim),inset -2px -2px 1.5px -1px var(--rim2),inset 0 0 10px 0 var(--linner),0 6px 14px -10px var(--ldrop)}
 :root[data-theme=dark]{--lf1:rgba(255,255,255,.17);--lf2:rgba(255,255,255,.05);--lf3:rgba(255,255,255,.1)}
 body::before{background:radial-gradient(420px 320px at 8% 4%,rgba(143,107,255,.42),transparent 70%),radial-gradient(380px 320px at 96% 40%,rgba(238,75,139,.26),transparent 70%),radial-gradient(440px 340px at 30% 98%,rgba(47,123,255,.28),transparent 70%)}

 /* drawer: floating glass look, but a plain composited layer = silky slide */
 .sidebar{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;height:calc(100vh - 20px);height:calc(100dvh - 20px - env(safe-area-inset-top,0px));max-height:none;border-radius:30px;z-index:70;will-change:transform;contain:none;
  background:radial-gradient(70% 28% at 8% 0%,var(--lspec),transparent 70%),linear-gradient(160deg,var(--lf1),var(--lf2) 55%,var(--lf3)),rgba(var(--bgrgb),.8);
  -webkit-backdrop-filter:none;backdrop-filter:none;border:0;box-shadow:var(--lg);
  transition:transform .3s cubic-bezier(.32,.72,0,1),visibility 0s .3s}
 .sidebar:not(.open){transform:translate3d(calc(-100% - 24px),0,0)}
 .sidebar.open{transform:translate3d(0,0,0);box-shadow:var(--lg),0 14px 34px -14px rgba(20,10,70,.45);transition:transform .3s cubic-bezier(.32,.72,0,1),visibility 0s}
 .scrim{z-index:65;background:rgba(10,6,30,.3);transition:opacity .25s,visibility .25s}
 .wave{height:90px;flex:none}
 .snav{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

 /* page footer never shows while the drawer is open */
 .sitefoot{position:relative;z-index:1;padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
 .shell:has(.sidebar.open) .sitefoot{visibility:hidden}
 .sitefoot .fr2{display:none}

 /* sticky header: solid-ish instead of live blur (the #1 cause of scroll lag) */
 .bar{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(var(--bgrgb),.9)}
 .card,.chip,.seg,.rc,.tile,.btn.o,.menu{-webkit-backdrop-filter:none;backdrop-filter:none}
 .menu{background:radial-gradient(60% 45% at 8% 0%,var(--lspec),transparent 70%),rgba(var(--bgrgb),.94)}
 .tile:hover{transform:none}
 .rv.in:not(.inst){animation-duration:.3s;animation-delay:calc(var(--i,0)*20ms)}
}
@media(hover:none){.tile,.btn,.chip,.pill,.seg button{transition-duration:.15s}}
/* ===== liquid click feel: spring squish + soft glow ripple (transform/opacity only = GPU-cheap) ===== */
a,button,label,.tile,.chip,.rc,.pill,.crumb,.seg button{touch-action:manipulation}
.tile.rv,.tile{transition:transform .45s var(--spring),border-color .25s}
.tile:active,.rc:active,.chip:active,.pill:active,.btn:active,.crumb:active,.seg button:active,.snav a:active,.ib:active{transform:scale(.965,.94);transition-duration:.12s}
.ripple,.tile .ripple,.snav .ripple{background:radial-gradient(circle,rgba(255,255,255,.9) 0,rgba(var(--hr,143,107,255),.4) 42%,transparent 70%);opacity:.75;animation-duration:.65s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
 .bar,.menu,.sidebar,.snack{background:rgba(var(--bgrgb),.94)}
}
</style>
